<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Pro</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}

button,input,select{
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
  margin:5px;
}

.hidden{display:none;}

#board{
  width:360px;
  height:360px;
  margin:auto;
  position:relative;
  border:3px solid white;
}

.snake{
  width:18px;
  height:18px;
  position:absolute;
  border-radius:4px;
}

.food{
  width:18px;
  height:18px;
  position:absolute;
  background:red;
  border-radius:50%;
}

/* TIENDA BLANCA */
.shop{
  background:white;
  color:black;
  min-height:100vh;
  padding:20px;
}

.shop button{
  background:#111;
  color:white;
}

/* OVERLAY */
#unlockOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

#unlockCard{
  background:#222;
  padding:25px;
  border-radius:15px;
}
</style>
</head>

<body>

<h1>🐍 Snake Pro</h1>

<div id="nameScreen" class="hidden">
  <h2>Ingresa tu nombre</h2>
  <input id="nameInput" placeholder="Tu nombre">
  <br>
  <button onclick="saveName()">Continuar</button>
</div>

<div id="menu" class="hidden">
  <p>👤 <b id="playerText"></b></p>
  <p>🏆 Mejor puntaje: <b id="bestScoreText"></b></p>
  <p>💰 Monedas: <b id="coinsText"></b></p>

  <select id="difficulty">
    <option value="1">Fácil</option>
    <option value="2" selected>Normal</option>
    <option value="3">Difícil</option>
  </select>
  <br><br>

  <button onclick="startGame()">▶️ Jugar</button><br>
  <button onclick="openShop('skins')">🐍 Skins</button>
  <button onclick="openShop('boards')">🟩 Tableros</button>
</div>

<div id="shopSkins" class="shop hidden"></div>
<div id="shopBoards" class="shop hidden"></div>

<div id="game" class="hidden">
  <p>Puntaje: <span id="scoreText">0</span></p>
  <div id="board"></div>
</div>

<div id="unlockOverlay">
  <div id="unlockCard">
    <h2 id="unlockTitle"></h2>
    <button onclick="closeUnlock()">OK</button>
  </div>
</div>

<script>
/* ===== DATOS ===== */
let playerName=localStorage.getItem("playerName");
let bestScore=+localStorage.getItem("bestScore")||0;
let coins=+localStorage.getItem("coins")||0;

let unlockedSkins=JSON.parse(localStorage.getItem("skins"))||["Verde"];
let unlockedBoards=JSON.parse(localStorage.getItem("boards"))||["Negro"];
let currentSkin=localStorage.getItem("currentSkin")||"Verde";
let currentBoard=localStorage.getItem("currentBoard")||"Negro";

/* ===== LISTAS ===== */
const skins=[
 {name:"Verde",color:"#00ff7f",price:0},
 {name:"Azul",color:"#1e90ff",price:30},
 {name:"Rojo",color:"#ff3333",price:50},
 {name:"Dorado",color:"#ffd700",price:100}
];

const boards=[
 {name:"Negro",color:"#000",price:0},
 {name:"Bosque",color:"#013220",price:40},
 {name:"Lava",color:"#4b0000",price:80}
];

/* ===== INICIO ===== */
if(!playerName){
  nameScreen.classList.remove("hidden");
}else showMenu();

function saveName(){
  if(!nameInput.value) return;
  playerName=nameInput.value;
  localStorage.setItem("playerName",playerName);
  nameScreen.classList.add("hidden");
  showMenu();
}

function showMenu(){
  menu.classList.remove("hidden");
  playerText.textContent=playerName;
  bestScoreText.textContent=bestScore;
  coinsText.textContent=coins;
}

/* ===== TIENDAS ===== */
function openShop(type){
  menu.classList.add("hidden");
  let div=type==="skins"?shopSkins:shopBoards;
  let list=type==="skins"?skins:boards;
  let unlocked=type==="skins"?unlockedSkins:unlockedBoards;

  div.innerHTML="<h2>Tienda</h2>";
  list.forEach(i=>{
    let own=unlocked.includes(i.name);
    div.innerHTML+=`
      <p style="color:${i.color}">
        ${i.name} - ${own?"✅":i.price+" monedas"}
        <button onclick="buy('${type}','${i.name}',${i.price})">Usar</button>
      </p>`;
  });
  div.innerHTML+=`<button onclick="backMenu()">⬅️ Volver</button>`;
  div.classList.remove("hidden");
}

function buy(type,name,price){
  let unlocked=type==="skins"?unlockedSkins:unlockedBoards;
  if(!unlocked.includes(name)){
    if(coins<price) return alert("No tienes monedas");
    coins-=price;
    unlocked.push(name);
  }
  if(type==="skins") currentSkin=name;
  else currentBoard=name;
  save();
  backMenu();
}

function backMenu(){
  shopSkins.classList.add("hidden");
  shopBoards.classList.add("hidden");
  showMenu();
}

function save(){
  localStorage.setItem("coins",coins);
  localStorage.setItem("bestScore",bestScore);
  localStorage.setItem("skins",JSON.stringify(unlockedSkins));
  localStorage.setItem("boards",JSON.stringify(unlockedBoards));
  localStorage.setItem("currentSkin",currentSkin);
  localStorage.setItem("currentBoard",currentBoard);
}

/* ===== JUEGO ===== */
let snake,food,dir,score,loop;

function startGame(){
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  board.style.background=boards.find(b=>b.name===currentBoard)?.color||"#000";
  snake=[{x:180,y:180}];
  dir="right";
  score=0;
  scoreText.textContent=0;
  spawnFood();
  clearInterval(loop);
  loop=setInterval(gameLoop,280);
}

function gameLoop(){
  let h={...snake[0]};
  if(dir==="up")h.y-=18;
  if(dir==="down")h.y+=18;
  if(dir==="left")h.x-=18;
  if(dir==="right")h.x+=18;

  if(h.x<0||h.y<0||h.x>=360||h.y>=360){
    endGame();return;
  }

  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;
    coins+=+difficulty.value;
    scoreText.textContent=score;
    spawnFood();
  }else snake.pop();

  draw();
}

function draw(){
  board.innerHTML="";
  snake.forEach(p=>{
    let d=document.createElement("div");
    d.className="snake";
    d.style.background=skins.find(s=>s.name===currentSkin)?.color||"lime";
    d.style.left=p.x+"px";
    d.style.top=p.y+"px";
    board.appendChild(d);
  });
  let f=document.createElement("div");
  f.className="food";
  f.style.left=food.x+"px";
  f.style.top=food.y+"px";
  board.appendChild(f);
}

function spawnFood(){
  food={x:Math.floor(Math.random()*20)*18,y:Math.floor(Math.random()*20)*18};
}

function endGame(){
  clearInterval(loop);
  if(score>bestScore) bestScore=score;
  save();
  game.classList.add("hidden");
  showMenu();
}

/* ===== CONTROLES ===== */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"&&dir!=="down")dir="up";
  if(e.key==="ArrowDown"&&dir!=="up")dir="down";
  if(e.key==="ArrowLeft"&&dir!=="right")dir="left";
  if(e.key==="ArrowRight"&&dir!=="left")dir="right";
});

/* ===== SWIPE MOVIL ===== */
let startX,startY;
document.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-startX;
  let dy=e.changedTouches[0].clientY-startY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>30&&dir!=="left")dir="right";
    if(dx<-30&&dir!=="right")dir="left";
  }else{
    if(dy>30&&dir!=="up")dir="down";
    if(dy<-30&&dir!=="down")dir="up";
  }
});
</script>

</body>
</html>
