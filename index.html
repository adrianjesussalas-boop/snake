<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
}

#gameContainer{
  display:flex;
  flex-direction:column;
  align-items:center;
  height:100vh;
}

#hud{
  width:100%;
  padding:10px;
  display:flex;
  justify-content:space-between;
  color:white;
  font-family:Arial;
  font-size:18px;
}

canvas{
  flex-grow:1;
  background:black;
  max-width:100vw;
  aspect-ratio:1/1;
  touch-action:none;
}
</style>
</head>

<body>

<div id="gameContainer">
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="record">Record: 0</span>
  </div>
  <canvas id="game"></canvas>
</div>

<script>
// ===============================
// CANVAS RESPONSIVO
// ===============================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  const size = Math.min(window.innerWidth, window.innerHeight - 60);
  canvas.width = size;
  canvas.height = size;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ===============================
// BLOQUEAR SCROLL SOLO EN CANVAS
// ===============================
canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
},{passive:false});

// ===============================
// VARIABLES
// ===============================
const box = 20;
let snake, food, dir, score;
let speed = 170;
let game;

// ===============================
// RECORD PERSONAL
// ===============================
let record = localStorage.getItem("record") || 0;
document.getElementById("record").textContent = "Record: " + record;

// ===============================
// INICIAR JUEGO
// ===============================
function startGame(){
  snake = [{x:9*box,y:9*box}];
  dir = "RIGHT";
  score = 0;
  document.getElementById("score").textContent = "Score: 0";
  food = spawnFood();
  clearInterval(game);
  game = setInterval(draw, speed);
}

// ===============================
// COMIDA (NO BORDE)
// ===============================
function spawnFood(){
  return {
    x: Math.floor(Math.random()*18 + 1)*box,
    y: Math.floor(Math.random()*18 + 1)*box
  };
}

// ===============================
// TECLADO (PC)
// ===============================
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" && dir!=="RIGHT") dir="LEFT";
  if(e.key==="ArrowUp" && dir!=="DOWN") dir="UP";
  if(e.key==="ArrowRight" && dir!=="LEFT") dir="RIGHT";
  if(e.key==="ArrowDown" && dir!=="UP") dir="DOWN";
});

// ===============================
// SWIPE (CELULAR) ✔✔✔
// ===============================
let startX=0,startY=0;
const swipeThreshold = 30;

canvas.addEventListener("touchstart",e=>{
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;

  if(Math.abs(dx)<swipeThreshold && Math.abs(dy)<swipeThreshold) return;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0 && dir!=="LEFT") dir="RIGHT";
    else if(dx<0 && dir!=="RIGHT") dir="LEFT";
  }else{
    if(dy>0 && dir!=="UP") dir="DOWN";
    else if(dy<0 && dir!=="DOWN") dir="UP";
  }
});

// ===============================
// COLISION SERPIENTE
// ===============================
function collision(head,array){
  return array.some(seg=>seg.x===head.x && seg.y===head.y);
}

// ===============================
// DIBUJO
// ===============================
function draw(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // comida
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  // serpiente
  for(let i=0;i<snake.length;i++){
    ctx.fillStyle = i===0 ? "lime" : "green";
    ctx.fillRect(snake[i].x,snake[i].y,box,box);
  }

  let headX = snake[0].x;
  let headY = snake[0].y;

  if(dir==="LEFT") headX-=box;
  if(dir==="UP") headY-=box;
  if(dir==="RIGHT") headX+=box;
  if(dir==="DOWN") headY+=box;

  if(headX===food.x && headY===food.y){
    score++;
    document.getElementById("score").textContent="Score: "+score;
    food = spawnFood();
  }else{
    snake.pop();
  }

  let newHead={x:headX,y:headY};

  if(
    headX<0 || headY<0 ||
    headX>=canvas.width || headY>=canvas.height ||
    collision(newHead,snake)
  ){
    clearInterval(game);
    if(score>record){
      record=score;
      localStorage.setItem("record",record);
    }
    alert("Game Over 😢");
    startGame();
    return;
  }

  snake.unshift(newHead);
}

// ===============================
startGame();
// ===============================
</script>

</body>
</html>
