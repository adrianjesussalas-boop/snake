<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🐍 Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* ===== MENÚ ===== */
#menu {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#menu h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

#monedas-menu {
  margin-bottom: 15px;
  font-size: 18px;
}

.menu-btn {
  width: 220px;
  padding: 14px;
  margin: 6px;
  font-size: 16px;
  background: #222;
  color: white;
  border: 2px solid white;
  border-radius: 8px;
}

/* ===== JUEGO ===== */
#juego {
  display: none;
}

#hud {
  display: flex;
  justify-content: space-around;
  font-size: 18px;
  margin-top: 10px;
}

#tablero {
  position: relative;
  width: 90vw;
  max-width: 400px;
  height: 90vw;
  max-height: 400px;
  background: black;
  margin: 10px auto;
  border: 2px solid white;
}

.serpiente {
  position: absolute;
  width: 20px;
  height: 20px;
  background: lime;
}

.comida {
  position: absolute;
  width: 20px;
  height: 20px;
  background: red;
}

/* ===== BOTONES MÓVIL ===== */
.botones {
  display: grid;
  grid-template-columns: 60px 60px 60px;
  justify-content: center;
  gap: 5px;
  margin-bottom: 20px;
}

.botones button {
  font-size: 22px;
  padding: 10px;
  background: #222;
  color: white;
  border: 2px solid white;
  border-radius: 5px;
}

@media (min-width: 600px) {
  .botones {
    display: none;
  }
}
</style>
</head>

<body>

<!-- ===== MENÚ ===== -->
<div id="menu">
  <h1>🐍 Snake</h1>
  <div id="monedas-menu">💰 Monedas: <span id="monedasTotal">0</span></div>

  <button class="menu-btn" onclick="seleccionarDificultad('facil')">🐢 Jugar Fácil</button>
  <button class="menu-btn" onclick="seleccionarDificultad('normal')">⚡ Jugar Normal</button>
  <button class="menu-btn" onclick="seleccionarDificultad('dificil')">🔥 Jugar Difícil</button>
</div>

<!-- ===== JUEGO ===== -->
<div id="juego">
  <div id="hud">
    <div>Puntaje: <span id="puntos">0</span></div>
    <div>💰 <span id="monedasJuego">0</span></div>
  </div>

  <div id="tablero"></div>

  <div class="botones">
    <div></div>
    <button onclick="direccion='arriba'">↑</button>
    <div></div>
    <button onclick="direccion='izquierda'">←</button>
    <button onclick="direccion='abajo'">↓</button>
    <button onclick="direccion='derecha'">→</button>
  </div>
</div>

<script>
const menu = document.getElementById("menu");
const juego = document.getElementById("juego");
const tablero = document.getElementById("tablero");
const puntosTexto = document.getElementById("puntos");
const monedasJuegoTexto = document.getElementById("monedasJuego");
const monedasMenuTexto = document.getElementById("monedasTotal");

const tamaño = 20;
let snake, direccion, comida, puntos, jugando, intervalo;
let velocidad = 170;
let monedasPorComida = 1;

// ===== MONEDAS GUARDADAS =====
let monedasTotales = parseInt(localStorage.getItem("monedas")) || 0;
monedasMenuTexto.textContent = monedasTotales;

// ===== SELECCIONAR DIFICULTAD =====
function seleccionarDificultad(modo) {
  if (modo === "facil") {
    velocidad = 220;
    monedasPorComida = 1;
  }
  if (modo === "normal") {
    velocidad = 170;
    monedasPorComida = 2;
  }
  if (modo === "dificil") {
    velocidad = 130;
    monedasPorComida = 3;
  }
  iniciarJuego();
}

// ===== INICIAR JUEGO =====
function iniciarJuego() {
  menu.style.display = "none";
  juego.style.display = "block";

  puntos = 0;
  jugando = true;
  direccion = "derecha";
  snake = [{ x: 200, y: 200 }];
  puntosTexto.textContent = puntos;
  monedasJuegoTexto.textContent = monedasTotales;
  comida = nuevaComida();

  clearInterval(intervalo);
  intervalo = setInterval(gameLoop, velocidad);
}

// ===== COMIDA =====
function nuevaComida() {
  const cols = Math.floor(tablero.clientWidth / tamaño);
  const rows = Math.floor(tablero.clientHeight / tamaño);
  let x, y;
  do {
    x = Math.floor(Math.random() * cols) * tamaño;
    y = Math.floor(Math.random() * rows) * tamaño;
  } while (snake.some(p => p.x === x && p.y === y));
  return { x, y };
}

// ===== TECLADO =====
document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && direccion !== "abajo") direccion = "arriba";
  if (e.key === "ArrowDown" && direccion !== "arriba") direccion = "abajo";
  if (e.key === "ArrowLeft" && direccion !== "derecha") direccion = "izquierda";
  if (e.key === "ArrowRight" && direccion !== "izquierda") direccion = "derecha";
});

// ===== GAME LOOP =====
function gameLoop() {
  if (!jugando) return;

  let cabeza = { ...snake[0] };
  if (direccion === "arriba") cabeza.y -= tamaño;
  if (direccion === "abajo") cabeza.y += tamaño;
  if (direccion === "izquierda") cabeza.x -= tamaño;
  if (direccion === "derecha") cabeza.x += tamaño;

  if (
    cabeza.x < 0 || cabeza.y < 0 ||
    cabeza.x >= tablero.clientWidth ||
    cabeza.y >= tablero.clientHeight ||
    snake.some(p => p.x === cabeza.x && p.y === cabeza.y)
  ) {
    perder();
    return;
  }

  snake.unshift(cabeza);

  if (cabeza.x === comida.x && cabeza.y === comida.y) {
    puntos++;
    puntosTexto.textContent = puntos;

    monedasTotales += monedasPorComida;
    localStorage.setItem("monedas", monedasTotales);
    monedasJuegoTexto.textContent = monedasTotales;
    monedasMenuTexto.textContent = monedasTotales;

    comida = nuevaComida();
  } else {
    snake.pop();
  }

  dibujar();
}

// ===== DIBUJAR =====
function dibujar() {
  tablero.innerHTML = "";
  snake.forEach(p => {
    const d = document.createElement("div");
    d.className = "serpiente";
    d.style.left = p.x + "px";
    d.style.top = p.y + "px";
    tablero.appendChild(d);
  });
  const c = document.createElement("div");
  c.className = "comida";
  c.style.left = comida.x + "px";
  c.style.top = comida.y + "px";
  tablero.appendChild(c);
}

// ===== PERDER =====
function perder() {
  jugando = false;
  clearInterval(intervalo);
  alert("Perdiste 😢");
  location.reload();
}
</script>

</body>
</html>
