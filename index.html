<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

.hidden { display: none; }

button, select {
  padding: 10px;
  font-size: 16px;
  margin: 5px;
}

#menu, #pauseScreen, #shopSkins, #shopBoards {
  padding: 20px;
}

#gameContainer {
  display: flex;
  justify-content: center;
}

#board {
  width: 400px;
  height: 400px;
  background: black;
  position: relative;
}

.snake {
  width: 20px;
  height: 20px;
  position: absolute;
}

.food {
  width: 20px;
  height: 20px;
  position: absolute;
  background: red;
}

#pauseScreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
}

#shopSkins {
  background: white;
  color: black;
}

.shop-item {
  border: 1px solid #ccc;
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<div id="menu">
  <h2>🐍 Snake</h2>
  <p id="playerInfo"></p>

  <select id="modeSelect">
    <option value="easy">Fácil</option>
    <option value="normal">Normal</option>
    <option value="hard">Difícil</option>
    <option value="extreme">Extremo 🔥</option>
  </select><br>

  <button onclick="startGame()">Jugar</button>
  <button onclick="openSkins()">Tienda Skins</button>
  <button onclick="openBoards()">Tienda Tableros</button>
</div>

<div id="game" class="hidden">
  <p>Puntaje: <span id="score">0</span></p>
  <div id="gameContainer">
    <div id="board"></div>
  </div>
</div>

<div id="pauseScreen" class="hidden">
  <h2>⏸️ JUEGO EN PAUSA</h2>
  <button onclick="togglePause()">Reanudar</button>
</div>

<div id="shopSkins" class="hidden">
  <h2>Tienda de Skins</h2>
  <div id="skinsList"></div>
  <button onclick="backMenu()">Volver</button>
</div>

<div id="shopBoards" class="hidden">
  <h2>Tienda de Tableros</h2>
  <div id="boardsList"></div>
  <button onclick="backMenu()">Volver</button>
</div>

<script>
/* ===== DATOS ===== */
const size = 20;
const boardSize = 400;

const speeds = {
  easy: 250,
  normal: 170,
  hard: 120,
  extreme: 90
};

const coinsPerMode = {
  easy: 1,
  normal: 2,
  hard: 3,
  extreme: 5
};

let player = localStorage.getItem("playerName");
if (!player) {
  player = prompt("Ingresa tu nombre:");
  localStorage.setItem("playerName", player);
}

let bestScore = Number(localStorage.getItem("bestScore")) || 0;
let coins = Number(localStorage.getItem("coins")) || 0;

const info = document.getElementById("playerInfo");
info.innerText = `👤 ${player} | 🏆 ${bestScore} | 💰 ${coins}`;

/* ===== JUEGO ===== */
let snake, food, dir, interval, score = 0;
let paused = false;
let currentMode = "easy";
const board = document.getElementById("board");

function startGame() {
  currentMode = document.getElementById("modeSelect").value;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  snake = [{x: 200, y: 200}];
  dir = "right";
  score = 0;
  document.getElementById("score").innerText = score;
  spawnFood();
  clearInterval(interval);
  interval = setInterval(loop, speeds[currentMode]);
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * 20) * size,
    y: Math.floor(Math.random() * 20) * size
  };
}

function loop() {
  if (paused) return;

  let head = {...snake[0]};
  if (dir === "up") head.y -= size;
  if (dir === "down") head.y += size;
  if (dir === "left") head.x -= size;
  if (dir === "right") head.x += size;

  if (head.x < 0 || head.y < 0 || head.x >= boardSize || head.y >= boardSize) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").innerText = score;
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  board.innerHTML = "";
  snake.forEach(s => {
    let d = document.createElement("div");
    d.className = "snake";
    d.style.background = "lime";
    d.style.left = s.x + "px";
    d.style.top = s.y + "px";
    board.appendChild(d);
  });

  let f = document.createElement("div");
  f.className = "food";
  f.style.left = food.x + "px";
  f.style.top = food.y + "px";
  board.appendChild(f);
}

function endGame() {
  clearInterval(interval);
  coins += coinsPerMode[currentMode];
  localStorage.setItem("coins", coins);

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("bestScore", bestScore);
  }

  alert("Perdiste 😢");
  location.reload();
}

/* ===== PAUSA ===== */
function togglePause() {
  paused = !paused;
  document.getElementById("pauseScreen").classList.toggle("hidden");
}

document.addEventListener("keydown", e => {
  if (e.key === "p" || e.key === "Escape") togglePause();
  if (e.key === "ArrowUp" && dir !== "down") dir = "up";
  if (e.key === "ArrowDown" && dir !== "up") dir = "down";
  if (e.key === "ArrowLeft" && dir !== "right") dir = "left";
  if (e.key === "ArrowRight" && dir !== "left") dir = "right";
});

/* ===== CELULAR: DESLIZAR ===== */
let touchStartX = 0, touchStartY = 0;
document.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
});

document.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].screenX - touchStartX;
  let dy = e.changedTouches[0].screenY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir !== "left") dir = "right";
    else if (dx < 0 && dir !== "right") dir = "left";
  } else {
    if (dy > 0 && dir !== "up") dir = "down";
    else if (dy < 0 && dir !== "down") dir = "up";
  }
});

/* ===== TIENDAS (BASE LISTA PARA EXPANDIR) ===== */
function openSkins() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("shopSkins").classList.remove("hidden");
}

function openBoards() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("shopBoards").classList.remove("hidden");
}

function backMenu() {
  location.reload();
}
</script>

</body>
</html>
