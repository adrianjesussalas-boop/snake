<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

button,select{
  padding:10px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}

#menu,#shopSkins,#shopBoards,#game{
  display:none;
}

canvas{
  background:#000;
  margin:auto;
  display:block;
}

.shop{
  background:white;
  color:black;
  padding:10px;
}

.item{
  border:1px solid #000;
  margin:5px;
  padding:5px;
}
</style>
</head>

<body>

<h1>🐍 Snake</h1>

<!-- MENÚ -->
<div id="menu">
  <select id="mode">
    <option value="facil">🟢 Fácil</option>
    <option value="normal">🟡 Normal</option>
    <option value="dificil">🔴 Difícil</option>
    <option value="extremo">🔥 Extremo</option>
  </select><br>

  <button onclick="startGame()">▶ Jugar</button><br>
  <button onclick="openShop('skins')">🎨 Tienda Skins</button>
  <button onclick="openShop('boards')">🟦 Tienda Tableros</button>
</div>

<!-- JUEGO -->
<div id="game">
  <p>Puntaje: <span id="score">0</span> | Monedas: <span id="coins">0</span></p>
  <button onclick="pauseGame()">⏸ Pausa</button>
  <canvas id="canvas" width="400" height="400"></canvas>
  <br>
  <button onclick="backMenu()">⬅ Menú</button>
</div>

<!-- TIENDA SKINS -->
<div id="shopSkins" class="shop">
  <h2>🎨 Skins</h2>
  <div id="skins"></div>
  <button onclick="backMenu()">⬅ Volver</button>
</div>

<!-- TIENDA TABLEROS -->
<div id="shopBoards" class="shop">
  <h2>🟦 Tableros</h2>
  <div id="boards"></div>
  <button onclick="backMenu()">⬅ Volver</button>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const box=20;
let snake,food,dir,score,coins,interval,paused=false;

coins=parseInt(localStorage.getItem("coins"))||0;
document.getElementById("coins").innerText=coins;

const skins=[
 {name:"Verde",color:"lime",price:0},
 {name:"Rojo",color:"red",price:10},
 {name:"Azul",color:"blue",price:20},
 {name:"Amarillo",color:"yellow",price:30},
 {name:"Rosa",color:"pink",price:40},
 {name:"Morado",color:"purple",price:50},
 {name:"Cian",color:"cyan",price:60},
 {name:"Naranja",color:"orange",price:70},
 {name:"Blanco",color:"white",price:80},
 {name:"Dorado",color:"gold",price:100}
];

const boards=[
 {name:"Negro",color:"#000",price:0},
 {name:"Gris",color:"#333",price:10},
 {name:"Azul oscuro",color:"#001f3f",price:20},
 {name:"Verde oscuro",color:"#013220",price:30},
 {name:"Morado",color:"#2e003e",price:40},
 {name:"Azul marino",color:"#000814",price:50},
 {name:"Verde bosque",color:"#0b3d2e",price:60},
 {name:"Rojo vino",color:"#3a0000",price:70},
 {name:"Marrón",color:"#3e2723",price:80},
 {name:"Celeste",color:"#87ceeb",price:90},
 {name:"Arena",color:"#c2b280",price:100},
 {name:"Rosa pastel",color:"#ffd1dc",price:120}
];

let skin=localStorage.getItem("skin")||"lime";
let board=localStorage.getItem("board")||"#000";

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 snake=[{x:200,y:200}];
 dir="RIGHT";
 score=0;
 paused=false;

 food={
  x:Math.floor(Math.random()*20)*box,
  y:Math.floor(Math.random()*20)*box
 };

 document.getElementById("score").innerText=0;

 let mode=document.getElementById("mode").value;
 let speed=170;

 if(mode==="facil") speed=230;
 if(mode==="normal") speed=170;
 if(mode==="dificil") speed=130;
 if(mode==="extremo"){
   speed=100;
   coins+=5;
 }

 document.getElementById("coins").innerText=coins;
 interval=setInterval(draw,speed);
}

function draw(){
 if(paused) return;

 ctx.fillStyle=board;
 ctx.fillRect(0,0,400,400);

 snake.forEach(p=>{
  ctx.fillStyle=skin;
  ctx.fillRect(p.x,p.y,box,box);
 });

 ctx.fillStyle="red";
 ctx.fillRect(food.x,food.y,box,box);

 let head={x:snake[0].x,y:snake[0].y};
 if(dir==="LEFT") head.x-=box;
 if(dir==="RIGHT") head.x+=box;
 if(dir==="UP") head.y-=box;
 if(dir==="DOWN") head.y+=box;

 if(head.x<0||head.x>=400||head.y<0||head.y>=400){
  gameOver();
  return;
 }

 if(head.x===food.x && head.y===food.y){
  score++;
  coins++;
  document.getElementById("score").innerText=score;
  document.getElementById("coins").innerText=coins;
  food={
   x:Math.floor(Math.random()*20)*box,
   y:Math.floor(Math.random()*20)*box
  };
 }else{
  snake.pop();
 }

 snake.unshift(head);
}

function gameOver(){
 clearInterval(interval);
 localStorage.setItem("coins",coins);
 alert("Perdiste 😢");
 backMenu();
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")dir="LEFT";
 if(e.key==="ArrowRight")dir="RIGHT";
 if(e.key==="ArrowUp")dir="UP";
 if(e.key==="ArrowDown")dir="DOWN";
});

let xStart,yStart;
canvas.addEventListener("touchstart",e=>{
 xStart=e.touches[0].clientX;
 yStart=e.touches[0].clientY;
});
canvas.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-xStart;
 let dy=e.changedTouches[0].clientY-yStart;
 if(Math.abs(dx)>Math.abs(dy)){
  dir=dx>0?"RIGHT":"LEFT";
 }else{
  dir=dy>0?"DOWN":"UP";
 }
});

function pauseGame(){paused=!paused;}

function backMenu(){
 clearInterval(interval);
 document.getElementById("game").style.display="none";
 document.getElementById("shopSkins").style.display="none";
 document.getElementById("shopBoards").style.display="none";
 document.getElementById("menu").style.display="block";
}

function openShop(type){
 document.getElementById("menu").style.display="none";
 if(type==="skins"){
  let s=document.getElementById("skins");
  s.innerHTML="";
  skins.forEach(i=>{
   s.innerHTML+=`<div class="item" style="background:${i.color}">
   ${i.name} - ${i.price} 🪙
   <button onclick="buySkin('${i.color}',${i.price})">Comprar</button></div>`;
  });
  document.getElementById("shopSkins").style.display="block";
 }else{
  let b=document.getElementById("boards");
  b.innerHTML="";
  boards.forEach(i=>{
   b.innerHTML+=`<div class="item" style="background:${i.color}">
   ${i.name} - ${i.price} 🪙
   <button onclick="buyBoard('${i.color}',${i.price})">Comprar</button></div>`;
  });
  document.getElementById("shopBoards").style.display="block";
 }
}

function buySkin(c,p){
 if(coins>=p){
  coins-=p;
  skin=c;
  localStorage.setItem("skin",c);
  document.getElementById("coins").innerText=coins;
 }
}

function buyBoard(c,p){
 if(coins>=p){
  coins-=p;
  board=c;
  localStorage.setItem("board",c);
  document.getElementById("coins").innerText=coins;
 }
}

document.getElementById("menu").style.display="block";
</script>

</body>
</html>
