<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Pro</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

button, input, select {
  padding: 10px;
  margin: 5px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

.hidden { display: none; }

#board {
  margin: auto;
  width: 360px;
  height: 360px;
  position: relative;
  border: 3px solid white;
}

.snake {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 4px;
}

.food {
  position: absolute;
  width: 18px;
  height: 18px;
  background: red;
  border-radius: 50%;
}

/* Pantalla nombre */
#nameScreen {
  padding: 30px;
}

/* Desbloqueo */
#unlockOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
}

#unlockCard {
  padding: 25px;
  border-radius: 16px;
  background: #222;
  animation: pop 0.4s ease;
}

@keyframes pop {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<h1>🐍 Snake Pro</h1>

<!-- PANTALLA NOMBRE -->
<div id="nameScreen" class="hidden">
  <h2>Ingresa tu nombre</h2>
  <input id="nameInput" placeholder="Tu nombre">
  <br>
  <button onclick="saveName()">Continuar</button>
</div>

<!-- MENÚ -->
<div id="menu" class="hidden">
  <p>👤 Jugador: <b id="playerText"></b></p>
  <p>🏆 Mejor puntaje: <b id="bestScoreText">0</b></p>
  <p>💰 Monedas: <b id="coinsText">0</b></p>

  <p>Dificultad:</p>
  <select id="difficulty">
    <option value="1">Fácil</option>
    <option value="2" selected>Normal</option>
    <option value="3">Difícil</option>
  </select>
  <br><br>

  <button onclick="startGame()">▶️ Jugar</button><br>
  <button onclick="openShop('skins')">🐍 Tienda Skins</button>
  <button onclick="openShop('boards')">🟩 Tienda Tableros</button>
  <br>
  <button onclick="changeName()">✏️ Cambiar nombre</button>
</div>

<div id="shopSkins" class="hidden"></div>
<div id="shopBoards" class="hidden"></div>

<!-- JUEGO -->
<div id="game" class="hidden">
  <p>Puntaje: <span id="scoreText">0</span></p>
  <div id="board"></div>
</div>

<!-- DESBLOQUEO -->
<div id="unlockOverlay">
  <div id="unlockCard">
    <h2 id="unlockTitle"></h2>
    <button onclick="closeUnlock()">Continuar</button>
  </div>
</div>

<script>
// ===== DATOS =====
let playerName = localStorage.getItem("playerName");
let bestScore = Number(localStorage.getItem("bestScore")) || 0;
let coins = Number(localStorage.getItem("coins")) || 0;

let unlockedSkins = JSON.parse(localStorage.getItem("skins")) || ["Verde"];
let unlockedBoards = JSON.parse(localStorage.getItem("boards")) || ["Negro"];
let currentSkin = localStorage.getItem("currentSkin") || "Verde";
let currentBoard = localStorage.getItem("currentBoard") || "Negro";

// ===== LISTAS =====
const skins = [
 {name:"Verde", color:"#00ff7f", price:0},
 {name:"Azul", color:"#1e90ff", price:20},
 {name:"Rojo", color:"#ff3333", price:40},
 {name:"Morado", color:"#8a2be2", price:60},
 {name:"Dorado", color:"#ffd700", price:100},
];

const skinsScore = [
 {name:"Experto", color:"#006400", score:10},
 {name:"Velocidad", color:"#00bfff", score:15},
 {name:"Maestro", color:"#800080", score:20},
 {name:"Élite", color:"#ff0000", score:25},
 {name:"Leyenda", color:"#ffcc00", score:30},
];

const boards = [
 {name:"Negro", color:"#000", price:0},
 {name:"Noche", color:"#020024", price:30},
 {name:"Bosque", color:"#013220", price:50},
 {name:"Hielo", color:"#add8e6", price:70},
 {name:"Lava", color:"#4b0000", price:100},
];

const boardsScore = [
 {name:"Oscuro Pro", color:"#222", score:10},
 {name:"Océano", color:"#001f3f", score:15},
 {name:"Selva", color:"#004d00", score:20},
 {name:"Inferno", color:"#660000", score:25},
 {name:"Épico", color:"#3b2f2f", score:30},
];

// ===== INICIO =====
if(!playerName){
  nameScreen.classList.remove("hidden");
}else{
  showMenu();
}

function saveName(){
  const val = nameInput.value.trim();
  if(!val) return alert("Escribe un nombre");
  playerName = val;
  localStorage.setItem("playerName", playerName);
  nameScreen.classList.add("hidden");
  showMenu();
}

function changeName(){
  localStorage.removeItem("playerName");
  location.reload();
}

function showMenu(){
  menu.classList.remove("hidden");
  playerText.textContent = playerName;
  coinsText.textContent = coins;
  bestScoreText.textContent = bestScore;
}

// ===== TIENDAS =====
function openShop(type){
  menu.classList.add("hidden");
  let div = type==="skins"?shopSkins:shopBoards;
  let list = type==="skins"?skins:boards;
  let unlocked = type==="skins"?unlockedSkins:unlockedBoards;

  div.innerHTML="<h2>Tienda</h2>";
  list.forEach(i=>{
    let owned = unlocked.includes(i.name);
    div.innerHTML+=`
      <p style="color:${i.color}">
      ${i.name} - ${owned?"✅":i.price+" monedas"}
      <button onclick="buy('${type}','${i.name}',${i.price})">Usar</button>
      </p>`;
  });
  div.innerHTML+=`<button onclick="backMenu()">⬅️ Volver</button>`;
  div.classList.remove("hidden");
}

function buy(type,name,price){
  let unlocked = type==="skins"?unlockedSkins:unlockedBoards;
  if(!unlocked.includes(name)){
    if(coins<price) return alert("No tienes monedas");
    coins-=price;
    unlocked.push(name);
  }
  if(type==="skins") currentSkin=name;
  else currentBoard=name;
  save();
  backMenu();
}

function backMenu(){
  shopSkins.classList.add("hidden");
  shopBoards.classList.add("hidden");
  showMenu();
}

function save(){
  localStorage.setItem("coins",coins);
  localStorage.setItem("skins",JSON.stringify(unlockedSkins));
  localStorage.setItem("boards",JSON.stringify(unlockedBoards));
  localStorage.setItem("currentSkin",currentSkin);
  localStorage.setItem("currentBoard",currentBoard);
  localStorage.setItem("bestScore",bestScore);
}

// ===== JUEGO =====
let snake, food, dir, score, interval;

function startGame(){
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  board.style.background = boards.concat(boardsScore).find(b=>b.name===currentBoard)?.color||"#000";
  snake=[{x:180,y:180}];
  dir="right";
  score=0;
  scoreText.textContent=0;
  spawnFood();
  clearInterval(interval);
  interval=setInterval(loop,280);
}

function loop(){
  let h={...snake[0]};
  if(dir==="right")h.x+=18;
  if(dir==="left")h.x-=18;
  if(dir==="up")h.y-=18;
  if(dir==="down")h.y+=18;

  if(h.x<0||h.y<0||h.x>=360||h.y>=360){
    endGame(); return;
  }

  snake.unshift(h);

  if(h.x===food.x&&h.y===food.y){
    score++;
    coins+=Number(difficulty.value);
    scoreText.textContent=score;
    spawnFood();
  } else snake.pop();

  draw();
}

function draw(){
  board.innerHTML="";
  snake.forEach(p=>{
    let d=document.createElement("div");
    d.className="snake";
    d.style.background = skins.concat(skinsScore).find(s=>s.name===currentSkin)?.color||"lime";
    d.style.left=p.x+"px";
    d.style.top=p.y+"px";
    board.appendChild(d);
  });
  let f=document.createElement("div");
  f.className="food";
  f.style.left=food.x+"px";
  f.style.top=food.y+"px";
  board.appendChild(f);
}

function spawnFood(){
  food={x:Math.floor(Math.random()*20)*18,y:Math.floor(Math.random()*20)*18};
}

function endGame(){
  clearInterval(interval);
  if(score>bestScore){
    bestScore=score;
  }
  checkUnlocks();
  save();
  game.classList.add("hidden");
  showMenu();
}

// ===== DESBLOQUEOS =====
function checkUnlocks(){
  skinsScore.forEach(s=>{
    if(score>=s.score&&!unlockedSkins.includes(s.name)){
      unlockedSkins.push(s.name);
      showUnlock("🐍 Skin desbloqueada: "+s.name,s.color);
    }
  });
  boardsScore.forEach(b=>{
    if(score>=b.score&&!unlockedBoards.includes(b.name)){
      unlockedBoards.push(b.name);
      showUnlock("🟩 Tablero desbloqueado: "+b.name,b.color);
    }
  });
}

function showUnlock(t,c){
  unlockCard.style.border="3px solid "+c;
  unlockTitle.textContent=t;
  unlockOverlay.style.display="flex";
}

function closeUnlock(){
  unlockOverlay.style.display="none";
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp")dir="up";
  if(e.key==="ArrowDown")dir="down";
  if(e.key==="ArrowLeft")dir="left";
  if(e.key==="ArrowRight")dir="right";
});
</script>

</body>
</html>
