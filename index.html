<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐍 Snake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #tablero {
      position: relative;
      width: 90vw;
      max-width: 400px;
      height: 90vw;
      max-height: 400px;
      background: #000;
      margin: 20px auto;
      border: 2px solid white;
    }
    .comida {
      background: red;
      position: absolute;
      width: 20px;
      height: 20px;
    }
    .serpiente {
      background: lime;
      position: absolute;
      width: 20px;
      height: 20px;
    }
    .botones {
      display: grid;
      grid-template-columns: 60px 60px 60px;
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
    }
    .botones button {
      font-size: 24px;
      padding: 10px;
      background: #222;
      color: white;
      border: 2px solid white;
      border-radius: 5px;
    }
    @media (min-width: 500px) {
      .botones {
        display: none;
      }
    }
  </style>
</head>
<body>

<h1>🐍 Snake</h1>
<div id="tablero"></div>
<p>Puntaje: <span id="puntos">0</span></p>

<div class="botones">
  <div></div>
  <button onclick="direccion='arriba'">↑</button>
  <div></div>
  <button onclick="direccion='izquierda'">←</button>
  <button onclick="direccion='abajo'">↓</button>
  <button onclick="direccion='derecha'">→</button>
</div>

<script>
  const tablero = document.getElementById("tablero");
  const puntosTexto = document.getElementById("puntos");

  const tamaño = 20;
  let puntos = 0;
  let snake = [{ x: 200, y: 200 }];
  let direccion = "derecha";
  let jugando = true;

  // Función para generar comida dentro del tablero y que no choque con la serpiente
  function nuevaComida() {
    let x, y, choca;
    const maxX = Math.floor((tablero.clientWidth - tamaño) / tamaño);
    const maxY = Math.floor((tablero.clientHeight - tamaño) / tamaño);
    do {
      x = Math.floor(Math.random() * (maxX + 1)) * tamaño;
      y = Math.floor(Math.random() * (maxY + 1)) * tamaño;
      choca = snake.some(parte => parte.x === x && parte.y === y);
    } while (choca);
    return { x, y };
  }

  let comida = nuevaComida();

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && direccion !== "abajo") direccion = "arriba";
    if (e.key === "ArrowDown" && direccion !== "arriba") direccion = "abajo";
    if (e.key === "ArrowLeft" && direccion !== "derecha") direccion = "izquierda";
    if (e.key === "ArrowRight" && direccion !== "izquierda") direccion = "derecha";
  });

  function dibujar() {
    tablero.innerHTML = "";
    snake.forEach(parte => {
      const s = document.createElement("div");
      s.className = "serpiente";
      s.style.left = parte.x + "px";
      s.style.top = parte.y + "px";
      tablero.appendChild(s);
    });
    const f = document.createElement("div");
    f.className = "comida";
    f.style.left = comida.x + "px";
    f.style.top = comida.y + "px";
    tablero.appendChild(f);
  }

  function perder() {
    if (jugando) {
      jugando = false;          // Bloquea que se llame otra vez
      alert("Perdiste 😢");    // Aparece una sola vez
      reiniciarJuego();         // Reinicia juego correctamente
    }
  }

  function reiniciarJuego() {
    snake = [{ x: 200, y: 200 }];
    direccion = "derecha";
    puntos = 0;
    puntosTexto.textContent = puntos;
    comida = nuevaComida();
    jugando = true;             // desbloquea juego para continuar
  }

  function mover() {
    if (!jugando) return;       // si perdimos, no mover hasta reinicio

    let cabeza = { ...snake[0] };

    if (direccion === "arriba") cabeza.y -= tamaño;
    if (direccion === "abajo") cabeza.y += tamaño;
    if (direccion === "izquierda") cabeza.x -= tamaño;
    if (direccion === "derecha") cabeza.x += tamaño;

    if (
      cabeza.x < 0 || cabeza.x >= tablero.clientWidth ||
      cabeza.y < 0 || cabeza.y >= tablero.clientHeight
    ) {
      perder();
      return;
    }

    if (snake.some(parte => parte.x === cabeza.x && parte.y === cabeza.y)) {
      perder();
      return;
    }

    snake.unshift(cabeza);

    if (cabeza.x === comida.x && cabeza.y === comida.y) {
      puntos++;
      puntosTexto.textContent = puntos;
      comida = nuevaComida();
    } else {
      snake.pop();
    }
  }

  setInterval(() => {
    mover();
    dibujar();
  }, 170);
</script>

</body>
</html>
