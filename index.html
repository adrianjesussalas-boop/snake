<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#fff;
  text-align:center;
  overflow:hidden;
}
button{
  padding:10px 16px;
  margin:6px;
  font-size:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
canvas{
  display:block;
  margin:15px auto;
  border:3px solid #555;
  touch-action:none;
}
.shop{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  max-height:70vh;
  overflow-y:auto;
}
.item{
  background:#222;
  padding:10px;
  border-radius:10px;
}
.equipped{
  outline:3px solid lime;
}
.mode-card{
  background:#222;
  padding:15px;
  margin:10px auto;
  width:80%;
  border-radius:12px;
}
#mobileControls{
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}
#mobileControls button{
  width:70px;
  height:70px;
  font-size:30px;
  border-radius:50%;
}
#grid{
  display:grid;
  grid-template-areas:
    ". up ."
    "left down right";
  gap:10px;
}
#up{grid-area:up;}
#down{grid-area:down;}
#left{grid-area:left;}
#right{grid-area:right;}
</style>
</head>

<body>

<!-- MENÚ -->
<div id="menu">
  <h1>🐍 Snake</h1>
  <p>🪙 <span id="coins">0</span></p>
  <p>🏆 <span id="bestScore">0</span></p>
  <button onclick="showModes()">🎮 Jugar</button>
  <button onclick="openShop('snake')">🐍 Skins</button>
  <button onclick="openShop('board')">🟩 Tableros</button>
</div>

<!-- MODOS -->
<div id="modes" style="display:none;">
  <h2>Modo</h2>
  <div class="mode-card"><button onclick="setMode(200,1)">🟢 Fácil</button></div>
  <div class="mode-card"><button onclick="setMode(160,2)">🔵 Normal</button></div>
  <div class="mode-card"><button onclick="setMode(120,3)">🟠 Difícil</button></div>
  <div class="mode-card"><button onclick="setMode(80,4)">🔴 Extremo</button></div>
  <button onclick="backMenu()">⬅ Volver</button>
</div>

<!-- TIENDA -->
<div id="shop" style="display:none;">
  <h2 id="shopTitle"></h2>
  <div class="shop" id="shopItems"></div>
  <button onclick="backMenu()">⬅ Volver</button>
</div>

<!-- JUEGO -->
<div id="game" style="display:none;">
  <p id="score"></p>
  <canvas id="canvas"></canvas>
</div>

<!-- CONTROLES MÓVIL -->
<div id="mobileControls">
  <div id="grid">
    <button id="up">↑</button>
    <button id="left">←</button>
    <button id="down">↓</button>
    <button id="right">→</button>
  </div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const mobileControls=document.getElementById("mobileControls");
const box=20;

let snake,food,dir,score,speed,coinsPerApple,interval;

let coins=+localStorage.getItem("coins")||0;
let bestScore=+localStorage.getItem("bestScore")||0;

let ownedSkins=JSON.parse(localStorage.getItem("ownedSkins"))||[0];
let ownedBoards=JSON.parse(localStorage.getItem("ownedBoards"))||[0];
let skinEquipped=+localStorage.getItem("skinEquipped")||0;
let boardEquipped=+localStorage.getItem("boardEquipped")||0;

const skins=[
 {name:"Verde",color:"#0a0",price:0},
 {name:"Azul",color:"#00f",price:25},
 {name:"Rojo",color:"#f00",price:40},
 {name:"Amarillo",color:"#ff0",price:60},
 {name:"Blanco",color:"#fff",price:80}
];

const boards=[
 {name:"Negro",color:"#000",price:0},
 {name:"Gris",color:"#444",price:25},
 {name:"Azul",color:"#001a33",price:40},
 {name:"Marrón",color:"#3e2723",price:60}
];

function updateUI(){
  coinsEl.textContent=coins;
  bestScoreEl.textContent=bestScore;
}
const coinsEl=document.getElementById("coins");
const bestScoreEl=document.getElementById("bestScore");
updateUI();

function hideAll(){
  menu.style.display=modes.style.display=shop.style.display=game.style.display="none";
  mobileControls.style.display="none";
}
function backMenu(){
  hideAll();
  menu.style.display="block";
  updateUI();
}
function showModes(){
  hideAll();
  modes.style.display="block";
}

function setMode(spd,coinsApple){
  speed=spd;
  coinsPerApple=coinsApple;
  startGame();
}

function resizeCanvas(){
  let size=Math.min(window.innerWidth*0.9,window.innerHeight*0.65);
  size=Math.floor(size/box)*box;
  canvas.width=size;
  canvas.height=size;
}
window.addEventListener("resize",resizeCanvas);

function startGame(){
  hideAll();
  game.style.display="block";
  mobileControls.style.display="block";
  resizeCanvas();

  snake=[{x:5*box,y:5*box}];
  dir="RIGHT";
  score=0;
  food=spawnFood();
  scoreEl.textContent=`Puntos: ${score}`;
  clearInterval(interval);
  interval=setInterval(draw,speed);
}

function spawnFood(){
  const cols=canvas.width/box;
  const rows=canvas.height/box;
  return {
    x:Math.floor(Math.random()*cols)*box,
    y:Math.floor(Math.random()*rows)*box
  };
}

function draw(){
  ctx.fillStyle=boards[boardEquipped].color;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle=skins[skinEquipped].color;
  snake.forEach(s=>ctx.fillRect(s.x,s.y,box,box));

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  let head={...snake[0]};
  if(dir==="LEFT")head.x-=box;
  if(dir==="RIGHT")head.x+=box;
  if(dir==="UP")head.y-=box;
  if(dir==="DOWN")head.y+=box;

  const cols=canvas.width/box;
  const rows=canvas.height/box;
  const hc=head.x/box;
  const hr=head.y/box;

  if(hc<0||hr<0||hc>=cols||hr>=rows||
     snake.some(s=>s.x===head.x&&s.y===head.y)){
    clearInterval(interval);
    alert("Perdiste 😢");
    backMenu();
    return;
  }

  if(head.x===food.x&&head.y===food.y){
    score++;
    coins+=coinsPerApple;
    if(score>bestScore){
      bestScore=score;
      localStorage.setItem("bestScore",bestScore);
    }
    localStorage.setItem("coins",coins);
    scoreEl.textContent=`Puntos: ${score}`;
    food=spawnFood();
  }else{
    snake.pop();
  }

  snake.unshift(head);
}

/* TECLADO */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"&&dir!=="RIGHT")dir="LEFT";
  if(e.key==="ArrowRight"&&dir!=="LEFT")dir="RIGHT";
  if(e.key==="ArrowUp"&&dir!=="DOWN")dir="UP";
  if(e.key==="ArrowDown"&&dir!=="UP")dir="DOWN";
});

/* BOTONES MÓVIL */
up.onclick=()=>{if(dir!=="DOWN")dir="UP"};
down.onclick=()=>{if(dir!=="UP")dir="DOWN"};
left.onclick=()=>{if(dir!=="RIGHT")dir="LEFT"};
right.onclick=()=>{if(dir!=="LEFT")dir="RIGHT"};
</script>
</body>
</html>
