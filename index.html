<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#fff;
  text-align:center;
  touch-action:none;
}
button{
  padding:10px 16px;
  margin:6px;
  font-size:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
canvas{
  background:#000;
  display:block;
  margin:0 auto;
}
.shop{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.item{
  background:#222;
  padding:10px;
  border-radius:10px;
}
.equipped{
  outline:3px solid lime;
}
</style>
</head>

<body>

<div id="menu">
  <h1>🐍 Snake</h1>
  <p>Monedas: <span id="coins">0</span></p>
  <button onclick="showModes()">🎮 Jugar</button>
  <button onclick="openShop('snake')">🐍 Skins</button>
  <button onclick="openShop('board')">🟩 Tableros</button>
</div>

<div id="modes" style="display:none;">
  <h2>Modo</h2>
  <button onclick="setMode('facil')">Fácil</button>
  <button onclick="setMode('normal')">Normal</button>
  <button onclick="setMode('dificil')">Difícil</button>
  <button onclick="setMode('extremo')">Extremo</button><br>
  <button onclick="backMenu()">⬅ Volver</button>
</div>

<div id="shop" style="display:none;">
  <h2 id="shopTitle"></h2>
  <div class="shop" id="shopItems"></div>
  <button onclick="backMenu()">⬅ Volver</button>
</div>

<div id="game" style="display:none;">
  <p id="score"></p>
  <canvas id="canvas" width="320" height="320"></canvas>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const box=20;

let snake,food,dir,score,speed,coinsPerApple;
let interval;

let coins=+localStorage.getItem("coins")||0;

let ownedSkins=JSON.parse(localStorage.getItem("ownedSkins"))||[0];
let ownedBoards=JSON.parse(localStorage.getItem("ownedBoards"))||[0];

let skinEquipped=+localStorage.getItem("skinEquipped")||0;
let boardEquipped=+localStorage.getItem("boardEquipped")||0;

const skins=[
"#00ff00","#ff0000","#00ffff","#ffff00","#ff00ff","#ffffff",
"#ffa500","#00ff7f","#1e90ff","#8a2be2","#ff1493","#7fff00"
];

const boards=[
"#000","#111","#222","#003300","#330000","#001133",
"#222200","#002222","#330033","#111133","#133311","#331111"
];

function updateCoins(){
  document.getElementById("coins").textContent=coins;
}
updateCoins();

function showModes(){
  hideAll();
  modes.style.display="block";
}

function openShop(type){
  hideAll();
  shop.style.display="block";
  shopItems.innerHTML="";
  shopTitle.textContent=type==="snake"?"🐍 Skins":"🟩 Tableros";

  let list=type==="snake"?skins:boards;
  let owned=type==="snake"?ownedSkins:ownedBoards;
  let equipped=type==="snake"?skinEquipped:boardEquipped;

  list.forEach((c,i)=>{
    let div=document.createElement("div");
    div.className="item"+(equipped===i?" equipped":"");
    div.innerHTML=`<div style="height:30px;background:${c}"></div>
    <p>Precio: ${(i+1)*5}</p>`;

    let btn=document.createElement("button");

    if(owned.includes(i)){
      btn.textContent=equipped===i?"Desequipar":"Equipar";
      btn.onclick=()=>{
        if(type==="snake"){
          skinEquipped=equipped===i?0:i;
          localStorage.setItem("skinEquipped",skinEquipped);
        }else{
          boardEquipped=equipped===i?0:i;
          localStorage.setItem("boardEquipped",boardEquipped);
        }
        openShop(type);
      };
    }else{
      btn.textContent="Comprar";
      btn.onclick=()=>{
        let price=(i+1)*5;
        if(coins>=price){
          coins-=price;
          owned.push(i);
          localStorage.setItem("coins",coins);
          localStorage.setItem(
            type==="snake"?"ownedSkins":"ownedBoards",
            JSON.stringify(owned)
          );
          updateCoins();
          openShop(type);
        }else alert("No tienes monedas");
      };
    }

    div.appendChild(btn);
    shopItems.appendChild(div);
  });
}

function backMenu(){
  hideAll();
  menu.style.display="block";
  updateCoins();
}

function hideAll(){
  menu.style.display="none";
  modes.style.display="none";
  shop.style.display="none";
  game.style.display="none";
}

function setMode(m){
  if(m==="facil"){speed=200;coinsPerApple=1;}
  if(m==="normal"){speed=170;coinsPerApple=2;}
  if(m==="dificil"){speed=120;coinsPerApple=3;}
  if(m==="extremo"){speed=80;coinsPerApple=4;}
  startGame();
}

function startGame(){
  hideAll();
  game.style.display="block";
  snake=[{x:5*box,y:5*box}];
  food=spawnFood();
  dir="RIGHT";
  score=0;
  scoreEl.textContent="Puntos: 0 | Monedas: "+coins;
  clearInterval(interval);
  interval=setInterval(draw,speed);
}

function spawnFood(){
  return{
    x:Math.floor(Math.random()*15)*box,
    y:Math.floor(Math.random()*15)*box
  };
}

function draw(){
  ctx.fillStyle=boards[boardEquipped];
  ctx.fillRect(0,0,canvas.width,canvas.height);

  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?skins[skinEquipped]:"#0a0";
    ctx.fillRect(s.x,s.y,box,box);
  });

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  let head={...snake[0]};
  if(dir==="LEFT")head.x-=box;
  if(dir==="RIGHT")head.x+=box;
  if(dir==="UP")head.y-=box;
  if(dir==="DOWN")head.y+=box;

  if(head.x===food.x&&head.y===food.y){
    score++;
    coins+=coinsPerApple;
    localStorage.setItem("coins",coins);
    scoreEl.textContent="Puntos: "+score+" | Monedas: "+coins;
    food=spawnFood();
  }else snake.pop();

  if(
    head.x<0||head.y<0||
    head.x>=canvas.width||head.y>=canvas.height||
    snake.some(s=>s.x===head.x&&s.y===head.y)
  ){
    clearInterval(interval);
    alert("Perdiste");
    backMenu();
    return;
  }
  snake.unshift(head);
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"&&dir!=="RIGHT")dir="LEFT";
  if(e.key==="ArrowRight"&&dir!=="LEFT")dir="RIGHT";
  if(e.key==="ArrowUp"&&dir!=="DOWN")dir="UP";
  if(e.key==="ArrowDown"&&dir!=="UP")dir="DOWN";
});

let xStart,yStart;
canvas.addEventListener("touchstart",e=>{
  xStart=e.touches[0].clientX;
  yStart=e.touches[0].clientY;
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  let dx=e.touches[0].clientX-xStart;
  let dy=e.touches[0].clientY-yStart;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0&&dir!=="LEFT")dir="RIGHT";
    if(dx<0&&dir!=="RIGHT")dir="LEFT";
  }else{
    if(dy>0&&dir!=="UP")dir="DOWN";
    if(dy<0&&dir!=="DOWN")dir="UP";
  }
  xStart=e.touches[0].clientX;
  yStart=e.touches[0].clientY;
},{passive:false});
</script>

</body>
</html>
