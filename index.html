<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

html,body{
  width:100%;
  height:100%;
  background:#111;
  overflow:hidden;
}

/* ===== MENÚ ===== */
#menu{
  position:fixed;
  inset:0;
  background:#111;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  z-index:10;
}

#menu h1{
  color:lime;
  font-size:40px;
}

.menu-btn{
  padding:12px 30px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.play{background:lime;}
.mode{background:#09f;color:white;}
.back{background:#f33;color:white;}

/* ===== HUD ===== */
#hud{
  width:100%;
  padding:10px;
  color:white;
  display:flex;
  justify-content:space-between;
  background:#000;
}

/* ===== CANVAS ===== */
canvas{
  background:black;
  display:block;
  margin:auto;
  touch-action:none;
}
</style>
</head>

<body>

<!-- MENÚ -->
<div id="menu">
  <h1>🐍 Snake</h1>
  <button class="menu-btn play" onclick="startFromMenu()">Jugar</button>
  <button class="menu-btn mode" onclick="setMode('facil')">Fácil</button>
  <button class="menu-btn mode" onclick="setMode('normal')">Normal</button>
  <button class="menu-btn mode" onclick="setMode('dificil')">Difícil</button>
</div>

<!-- HUD -->
<div id="hud" style="display:none">
  <span id="score">Puntos: 0</span>
  <span id="mode">Modo: Normal</span>
</div>

<canvas id="game"></canvas>

<script>
// =======================
// CANVAS RESPONSIVO
// =======================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  const size = Math.min(window.innerWidth, window.innerHeight - 50);
  canvas.width = size;
  canvas.height = size;
}
window.addEventListener("resize", resize);
resize();

// =======================
// BLOQUEAR SCROLL
// =======================
canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
},{passive:false});

// =======================
// VARIABLES
// =======================
const box = 20;
let snake, food, dir, score, game;
let speed = 170;
let currentMode = "Normal";

// =======================
// MODOS
// =======================
function setMode(m){
  if(m==="facil"){ speed = 220; currentMode="Fácil"; }
  if(m==="normal"){ speed = 170; currentMode="Normal"; }
  if(m==="dificil"){ speed = 120; currentMode="Difícil"; }
  document.getElementById("mode").textContent = "Modo: " + currentMode;
}

// =======================
// INICIAR DESDE MENÚ
// =======================
function startFromMenu(){
  document.getElementById("menu").style.display="none";
  document.getElementById("hud").style.display="flex";
  startGame();
}

// =======================
// INICIAR JUEGO
// =======================
function startGame(){
  snake = [{x:9*box,y:9*box}];
  dir = "RIGHT";
  score = 0;
  food = spawnFood();
  document.getElementById("score").textContent="Puntos: 0";
  clearInterval(game);
  game = setInterval(draw, speed);
}

// =======================
// COMIDA
// =======================
function spawnFood(){
  return {
    x: Math.floor(Math.random()*18+1)*box,
    y: Math.floor(Math.random()*18+1)*box
  };
}

// =======================
// TECLADO (PC)
// =======================
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft" && dir!=="RIGHT") dir="LEFT";
  if(e.key==="ArrowUp" && dir!=="DOWN") dir="UP";
  if(e.key==="ArrowRight" && dir!=="LEFT") dir="RIGHT";
  if(e.key==="ArrowDown" && dir!=="UP") dir="DOWN";
});

// =======================
// SWIPE (CELULAR) ✔
// =======================
let startX=0,startY=0;
canvas.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0 && dir!=="LEFT") dir="RIGHT";
    else if(dx<0 && dir!=="RIGHT") dir="LEFT";
  }else{
    if(dy>0 && dir!=="UP") dir="DOWN";
    else if(dy<0 && dir!=="DOWN") dir="UP";
  }
});

// =======================
// COLISIÓN
// =======================
function collision(head,array){
  return array.some(p=>p.x===head.x&&p.y===head.y);
}

// =======================
// DIBUJO
// =======================
function draw(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // comida
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  // serpiente
  snake.forEach((p,i)=>{
    ctx.fillStyle=i===0?"lime":"green";
    ctx.fillRect(p.x,p.y,box,box);
  });

  let headX=snake[0].x;
  let headY=snake[0].y;

  if(dir==="LEFT") headX-=box;
  if(dir==="UP") headY-=box;
  if(dir==="RIGHT") headX+=box;
  if(dir==="DOWN") headY+=box;

  if(headX===food.x && headY===food.y){
    score++;
    document.getElementById("score").textContent="Puntos: "+score;
    food=spawnFood();
  }else{
    snake.pop();
  }

  let newHead={x:headX,y:headY};

  if(
    headX<0||headY<0||
    headX>=canvas.width||headY>=canvas.height||
    collision(newHead,snake)
  ){
    clearInterval(game);
    alert("Perdiste 😢");
    document.getElementById("menu").style.display="flex";
    document.getElementById("hud").style.display="none";
    return;
  }

  snake.unshift(newHead);
}
</script>

</body>
</html>
